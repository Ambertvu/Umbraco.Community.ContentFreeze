name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test src/ContentFreeze.slnx -c Release

      - name: Build & Pack
        run: |
          dotnet pack src/ContentFreeze/ContentFreeze.csproj -c Release /p:Version=${{github.ref_name}}
          dotnet pack src/ContentFreeze.Hangfire/ContentFreeze.Hangfire.csproj -c Release /p:Version=${{github.ref_name}}
          dotnet pack src/ContentFreeze.Forms/ContentFreeze.Forms.csproj -c Release /p:Version=${{github.ref_name}}
          dotnet pack src/ContentFreeze.Commerce/ContentFreeze.Commerce.csproj -c Release /p:Version=${{github.ref_name}}

      - name: Push to NuGet
        run: dotnet nuget push **/*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
