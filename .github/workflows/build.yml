name: Build and Test

on:
  push:
    branches: [ "v*/dev", "v*/main" ]
  pull_request:
    branches: [ "v*/dev", "v*/main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/ContentFreeze.slnx -c Release

      - name: Test
        run: dotnet test src/ContentFreeze.slnx -c Release --no-build
